<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ah-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E2C275" />
      <stop offset="50%" stopColor="#C5A059" />
      <stop offset="100%" stopColor="#9C7730" />
    </linearGradient>
    <linearGradient id="ah-crimson-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#9E1B1B" />
      <stop offset="50%" stopColor="#8B0000" />
      <stop offset="100%" stopColor="#6E0000" />
    </linearGradient>
    <filter id="ah-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" floodColor="#000000" floodOpacity="0.2" />
    </filter>
  </defs>

  {/* Background Badge: Warm Cream / Ivory with Golden Border */}
  <rect width="512" height="512" rx="48" fill="#FDFCF8" />
  <rect x="12" y="12" width="488" height="488" rx="36" fill="none" stroke="url(#ah-gold-grad)" stroke-width="3" opacity="0.4" />

  {/* Exact AH Monogram from User's Logo scaled to center */}
  <g filter="url(#ah-shadow)" transform="translate(68, 50) scale(1.65)">
    {/* A Top and Left Diagonal Stem */}
    <path
      d="M 72 22 L 122 22 L 86 92 L 52 92 Z"
      fill="url(#ah-crimson-grad)"
    />

    {/* Center Diagonal Stem (Shared right leg of A and left upright of H) */}
    <path
      d="M 122 22 L 150 22 L 100 124 L 72 124 Z"
      fill="url(#ah-crimson-grad)"
    />

    {/* Right Slanted Pillar of H */}
    <path
      d="M 166 22 L 196 22 L 146 124 L 116 124 Z"
      fill="url(#ah-gold-grad)"
    />

    {/* Horizontal Connector Crossbar */}
    <path
      d="M 52 74 L 188 74 L 178 94 L 42 94 Z"
      fill="url(#ah-crimson-grad)"
    />

    {/* Inner Counter Triangle of A */}
    <path
      d="M 97 34 L 115 74 L 77 74 Z"
      fill="#FDFCF8"
    />

    {/* Inner Cutout inside H */}
    <path
      d="M 148 24 L 165 24 L 141 74 L 124 74 Z"
      fill="#FDFCF8"
    />

    {/* Signature Bottom-Left Swoosh Elements */}
    {/* Upper curved swoosh petal */}
    <path
      d="M 42 94 C 30 98, 22 106, 22 116 C 22 124, 32 128, 48 124 C 62 120, 74 110, 84 94 Z"
      fill="url(#ah-crimson-grad)"
    />

    {/* Lower dynamic tapered wave tail */}
    <path
      d="M 88 108 C 68 122, 42 138, 14 140 C 9 140, 7 137, 9 133 C 13 126, 22 118, 38 108 C 52 98, 64 96, 60 102 C 44 112, 28 122, 20 128 C 42 124, 68 114, 88 104 Z"
      fill="url(#ah-gold-grad)"
    />
  </g>

  {/* Brand Name Typography */}
  <text 
    x="256" 
    y="355" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="38" 
    letter-spacing="5" 
    fill="#8B0000"
  >
    ABEL HABESHA
  </text>

  {/* Amharic Subtitle */}
  <text 
    x="256" 
    y="395" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-weight="700" 
    font-size="22" 
    letter-spacing="2" 
    fill="#C5A059"
  >
    አቤል ሓበሻ ባህላዊ አልባሳት
  </text>

  {/* Exact Phone Number from User's Logo */}
  <text 
    x="256" 
    y="442" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-weight="800" 
    font-size="30" 
    letter-spacing="3" 
    fill="#8B0000"
  >
    +251 913 31 23 14
  </text>
</svg>

